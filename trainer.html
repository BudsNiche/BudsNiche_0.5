<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BudsNiche — Judge Trainer</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .trainer-shell{width:min(1100px,calc(100% - 28px));margin:22px auto 60px;display:grid;gap:16px}
    .trainer-head,.trainer-panel,.trainer-card{background:var(--surface);border:1px solid #aeb9af;border-radius:var(--radius);box-shadow:var(--shadow)}
    .trainer-head{padding:24px;background:linear-gradient(90deg,rgba(47,107,60,.08),transparent 45%),var(--surface)}
    .trainer-head h1{margin:0 0 8px;font-size:clamp(2.2rem,5vw,4rem);letter-spacing:-.045em}
    .trainer-head p{margin:0;color:var(--muted)}
    .trainer-panel{padding:18px}
    .trainer-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end}
    .trainer-filter-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
    .trainer-label{display:grid;gap:6px;font:800 .75rem var(--mono);text-transform:uppercase;color:var(--brand-dark)}
    .trainer-label input,.trainer-label textarea{width:100%;border:1px solid var(--border);border-radius:7px;background:#fff;padding:10px 11px;color:var(--text)}
    .trainer-label textarea{min-height:68px;resize:vertical}
    .trainer-button{min-height:42px;border:1px solid var(--brand);border-radius:7px;background:var(--brand);color:#fff;padding:9px 14px;font-weight:900;cursor:pointer}
    .trainer-button.secondary{background:#f2f4f1;color:var(--brand-dark);border-color:var(--border)}
    .trainer-status{margin:10px 0 0;color:var(--muted);font-size:.82rem}
    .trainer-status.error{color:#a94319;font-weight:800}
    .trainer-list{display:grid;gap:12px}
    .trainer-card{overflow:hidden}
    .trainer-card-head{padding:11px 14px;border-bottom:1px solid var(--border);background:linear-gradient(#edf1ec,#e2e8e1);display:flex;justify-content:space-between;gap:10px;align-items:center}
    .trainer-card-head strong{font:950 .86rem var(--mono);color:var(--brand-dark)}
    .trainer-card-head span{font:800 .7rem var(--mono);color:var(--muted)}
    .trainer-card-body{padding:16px;display:grid;gap:14px}
    .trainer-answer{font-size:1.4rem;font-weight:900;margin:0}
    .trainer-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .trainer-meta div{border:1px solid #d3dcd3;border-radius:7px;background:#f4f6f3;padding:9px}
    .trainer-meta small{display:block;color:var(--muted);font:700 .66rem var(--mono);text-transform:uppercase}
    .trainer-meta strong{display:block;margin-top:2px;font:900 1rem var(--mono)}
    .trainer-reason{margin:0;color:var(--muted);font-size:.86rem}
    .trainer-edit{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px}
    .trainer-save-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .trained-badge{padding:5px 8px;border:1px solid #8bb394;border-radius:5px;background:#e1f0e4;color:#22532d;font:900 .7rem var(--mono)}
    .review-badge{padding:5px 8px;border:1px solid #e4b39c;border-radius:5px;background:#f8e1d6;color:#a94319;font:900 .7rem var(--mono)}
    .trainer-empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:8px}
    @media(max-width:720px){.trainer-grid,.trainer-filter-grid,.trainer-edit,.trainer-meta{grid-template-columns:1fr}.trainer-button{width:100%}}
  </style>
</head>
<body>
<header class="site-header">
  <div class="header-inner" style="grid-template-columns:260px 1fr auto">
    <a class="brand" href="index.html"><span class="brand-mark">BN</span><span>BudsNiche</span></a>
    <div class="search">PRIVATE // JUDGE TRAINER</div>
    <a class="header-button" href="index.html">Back to site</a>
  </div>
</header>

<main class="trainer-shell">
  <section class="trainer-head">
    <p class="eyebrow">OWNER TOOL // BUILD V20</p>
    <h1>Judge Trainer</h1>
    <p>Review Luna's cached judgments. Change a score when you disagree, then save it as owner-approved training.</p>
  </section>

  <section class="trainer-panel">
    <div class="trainer-grid">
      <label class="trainer-label">Trainer key
        <input id="trainerKey" type="password" autocomplete="current-password" placeholder="Enter your private trainer key" />
      </label>
      <button class="trainer-button" id="loadBtn" type="button">Load Judgments</button>
    </div>
    <p class="trainer-status" id="statusText">Your key stays in this tab only. It is not saved in localStorage.</p>
  </section>

  <section class="trainer-panel hidden" id="filterPanel">
    <div class="trainer-filter-grid">
      <label class="trainer-label">Filter topic or answer
        <input id="filterText" type="search" placeholder="Iowa State, Therkildsen, Physics..." />
      </label>
      <button class="trainer-button secondary" id="refreshBtn" type="button">Refresh</button>
    </div>
  </section>

  <section class="trainer-list" id="trainerList"></section>
</main>

<script src="trainer.js" defer></script>
</body>
</html>
